
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partecipiamo Cassino - Home Natale</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@400;700&family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    
    <!-- SHIM CRITICO: Definisce process.env per evitare errori ReferenceError nel browser -->
    <script>
        window.process = { 
            env: { 
                API_KEY: "" 
            } 
        };
    </script>

    <!-- Babel Standalone per compilazione TSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; margin: 0; padding: 0; }
        .font-festive { font-family: 'Mountains of Christmas', cursive; }
        .font-serif-elegant { font-family: 'Playfair Display', serif; }
        @keyframes snowfall {
            0% { transform: translateY(-10vh) translateX(0); }
            100% { transform: translateY(110vh) translateX(20px); }
        }
        .snowflake { position: fixed; top: -10%; color: white; user-select: none; z-index: 1000; pointer-events: none; animation: snowfall linear infinite; }
        #root { min-height: 100vh; display: flex; flex-direction: column; }
        
        /* Stile per messaggi di errore diagnostici */
        #error-overlay { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(255,255,255,0.95); 
            z-index: 9999; 
            padding: 40px; 
            color: #b91c1c; 
            font-family: sans-serif;
        }
    </style>

    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "@google/genai": "https://esm.sh/@google/genai@1.3.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
<body class="bg-slate-50">
    <!-- Overlay di errore nascosto di default -->
    <div id="error-overlay">
        <h1 style="font-size: 24px; font-weight: bold; margin-bottom: 15px;">Errore di caricamento del sito</h1>
        <p id="error-message"></p>
        <p style="margin-top: 20px; color: #4b5563; font-size: 14px;">
            Suggerimento: Assicurati di aver caricato tutte le cartelle (<code>components</code>, <code>services</code>) 
            e che il tuo hosting permetta l'accesso ai file <code>.tsx</code>.
        </p>
    </div>

    <div id="root"></div>

    <script>
        // Cattura errori di caricamento script e runtime
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            const overlay = document.getElementById('error-overlay');
            const message = document.getElementById('error-message');
            overlay.style.display = 'block';
            message.innerHTML = `<strong>Dettaglio:</strong> ${msg}<br><br><code>File: ${url}<br>Linea: ${lineNo}</code>`;
            return false;
        };
    </script>

    <!-- Caricamento principale -->
    <script type="text/babel" data-type="module" src="./index.tsx"></script>
</body>
</html>
